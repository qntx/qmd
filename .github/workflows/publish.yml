name: Publish to crates.io

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run cargo publish --dry-run only (no upload).'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-crates.yml@v2
    permissions:
      contents: read
    with:
      # Dependency order: qmd → qmd-mcp → qmd-cli.
      packages: "qmd qmd-mcp qmd-cli"
      # llama-cpp-sys-2 builds llama.cpp with cmake and runs bindgen
      # against libclang during the publish verify build.
      apt-packages: cmake clang libclang-dev
      timeout-minutes: 90
      # Tag pushes publish for real (inputs.dry-run is unset → false);
      # manual dispatches default to a dry-run rehearsal.
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
