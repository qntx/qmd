name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  taplo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes @taplo/cli@0.7.0 fmt --check

  markdownlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # crates/*/skills/** is byte-verbatim upstream content — excluded.
      - run: npx --yes markdownlint-cli2@0.23.3 "*.md" "crates/*/README.md"

  ci:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      submodules: false
      deny: true
      # rustdoc -D warnings: broken intra-doc links must not reach docs.rs.
      doc: true
      # `cargo publish --workspace --dry-run --locked`: the tag-time publish
      # must not be the first place packaging failures surface.
      package-check: true
      # GPU passthroughs (cuda/vulkan) are opt-in and would fail on this image;
      # llama+testing is the supported set (see crates/qmd/Cargo.toml).
      features: '--features llama,testing'
      # llama-cpp-sys-2 builds llama.cpp with cmake and runs bindgen against
      # libclang. The image ships both; pin them anyway against label drift.
      apt-packages: 'cmake clang libclang-dev'

  # The qmd crate is also usable without llama.cpp (storage/BM25 only,
  # audit D-4 — the Justfile clippy recipe gates it locally). A separate
  # job because ci-rust takes a single feature set per call.
  ci-minimal:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      submodules: false
      deny: false
      packages: 'qmd'
      features: '--no-default-features --features testing'

  # MSRV gate: workspace rust-version = 1.95. Checking the no-llama
  # feature set keeps the job free of the cmake/clang C++ build while
  # still covering the full dependency resolution.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal

      # --locked: the recorded dep set is what release builds use; a
      # future dep bump raising rust-version fails the bump's own PR.
      - name: cargo check (MSRV)
        run: cargo +1.95 check -p qmd --no-default-features --features testing --locked

  # D5: Windows regression gate. The reusable workflow needs
  # `contents: write`, so it cannot run on PRs — main pushes and
  # manual dispatches only.
  windows-build:
    if: github.event_name != 'pull_request'
    uses: qntx/workflows/.github/workflows/release-rust.yml@v2
    permissions:
      contents: write
    with:
      bin: qmd
      package: qmd-cli
      targets: x86_64-pc-windows-msvc

  # Handwritten smoke on the produced binary (deviation from the
  # call-only-@v2 convention, registered in p7 D5). Verifies the
  # artifact runs and that D10 removed the VCOMP140 OpenMP import.
  windows-smoke:
    needs: windows-build
    if: always() && github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      NO_COLOR: '1'
      QMD_DOCTOR_DEVICE_PROBE: '0'
    steps:
      - name: checkout (vendored corpus)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/dist

      - name: extract binary
        shell: bash
        run: |
          cd "${{ runner.temp }}/dist"
          archive=$(ls qmd-*.zip)
          unzip -o "$archive" -d "${{ runner.temp }}"
          find "${{ runner.temp }}" -name 'qmd*' -type f | head -5

      - name: smoke run
        shell: bash
        env:
          HOME: ${{ runner.temp }}/qmd-home
          USERPROFILE: ${{ runner.temp }}/qmd-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/qmd-home/xdg-config
          XDG_CACHE_HOME: ${{ runner.temp }}/qmd-home/xdg-cache
          QMD_CONFIG_DIR: ${{ runner.temp }}/qmd-home/qmdcfg
        run: |
          set -x
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$QMD_CONFIG_DIR"
          QMD="${{ runner.temp }}/qmd.exe"
          CORPUS="$(pwd)/crates/qmd/tests/fixtures/eval-docs"
          "$QMD" --version
          "$QMD" collection add "$CORPUS" --name eval-docs
          "$QMD" search "API versioning"
          "$QMD" status

      - name: dll dependents
        if: always()
        shell: bash
        run: |
          {
            echo '## windows dll dependents'
            echo '```'
            llvm-objdump -p "${{ runner.temp }}/qmd.exe" | grep 'DLL Name' || \
              dumpbin /dependents "${{ runner.temp }}/qmd.exe"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
