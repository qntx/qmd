[package]
name                   = "meme-mcp"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "MCP server for meme."
keywords               = ["mcp", "search", "markdown", "rag"]
categories             = ["network-programming"]

# Default features only: the GPU passthroughs need toolkits docs.rs lacks (audit G-1).
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# GPU backend passthroughs (D9) — same caveats as the `meme` crate
# features; opt-in per machine.
metal  = ["meme/metal"]
cuda   = ["meme/cuda"]
vulkan = ["meme/vulkan"]

[dependencies]
axum       = { version = "0.8.9" }
meme       = { version = "1.0.0", path = "../meme", default-features = false, features = ["llama"] }
regex      = { version = "1.13.1" }
rmcp       = { version = "3.5.1", features = ["server", "transport-io"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror  = "2.0.21"
time       = { version = "0.3.36" }
tokio      = { version = "1.53.3", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
url        = { version = "2.5.8" }

# rustix is only referenced by the `cfg(unix)` daemon paths
# (sigterm/setsid); declaring it per-target silences the Windows
# `unused_crate_dependencies` warning (S1 finding, P7.2).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }

[dev-dependencies]
tempfile = "3.27.0"
