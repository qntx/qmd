[package]
name                   = "qmd-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "Command-line interface for qmd."
keywords               = ["search", "markdown", "cli", "rag"]
categories             = ["command-line-utilities"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "qmd"
path = "src/main.rs"
doc  = false   # bin `qmd` and lib `qmd` would collide under target/doc/

[lints]
workspace = true

[features]
default = ["mcp", "ast"]
mcp = ["dep:qmd-mcp", "dep:tokio"]
ast = ["qmd/ast"]
# GPU backend passthroughs (D9): opt-in per machine, same caveats as
# the `qmd` crate features — `cargo install qmd-cli --features cuda`.
metal  = ["qmd/metal"]
cuda   = ["qmd/cuda"]
vulkan = ["qmd/vulkan"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
qmd = { version = "0.6.0", path = "../qmd", default-features = false, features = ["llama"] }
qmd-mcp = { version = "0.6.0", path = "../qmd-mcp", optional = true }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
time = { version = "0.3.55", features = ["local-offset", "formatting", "parsing"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread"], optional = true }

# signal-hook's `iterator` module is `cfg(not(windows))`; Windows uses
# `ctrlc` for the same cursor-restore + exit(130) handler (P7.2).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"

[dev-dependencies]
qmd      = { version = "0.6.0", path = "../qmd", default-features = false, features = ["llama", "testing"] }
regex    = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
