[package]
name                   = "qmd-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "Command-line interface for qmd."
keywords               = ["search", "markdown", "cli", "rag"]
categories             = ["command-line-utilities"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "qmd"
path = "src/main.rs"
doc  = false   # bin `qmd` and lib `qmd` would collide under target/doc/

[lints]
workspace = true

[features]
default = ["mcp"]
mcp = ["dep:qmd-mcp", "dep:tokio"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
qmd = { version = "0.6.0", path = "../qmd" }
qmd-mcp = { version = "0.6.0", path = "../qmd-mcp", optional = true }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
signal-hook = "0.4.4"
time = { version = "0.3.55", features = ["local-offset", "formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
regex    = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
