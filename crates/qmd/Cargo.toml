[package]
name                   = "qmd"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "On-device hybrid search for markdown: BM25, vectors and LLM reranking. Rust port of tobi/qmd."
keywords               = ["search", "markdown", "embedding", "fts5", "rag"]
categories             = ["text-processing", "database"]

[package.metadata.docs.rs]
no-default-features = true
features            = ["testing"]
rustdoc-args        = ["--cfg", "docsrs"]

[features]
default = ["llama", "ast"]
# Deterministic in-memory inference backends (`qmd::testing`) for tests
# and downstream embedders — no model files required.
testing = []
# Tree-sitter AST break points for `--chunk-strategy auto`
# (`chunk::ast`). Grammar crates are pinned to the exact upstream wasm
# versions; `tree-sitter` runtime on the 0.26 line matching upstream's
# `web-tree-sitter` 0.26. Enabled by default.
ast = ["dep:tree-sitter", "dep:tree-sitter-typescript", "dep:tree-sitter-python",
       "dep:tree-sitter-go", "dep:tree-sitter-rust"]
# On-device inference on llama.cpp (`llm::llamacpp`) plus HuggingFace model
# download (`llm::download`). Enabled by default; builds C++ via cmake and
# bindgen, so `cmake`, `clang`/`libclang` must be installed.
llama = ["dep:llama-cpp-2", "dep:ureq"]
# GPU backend passthroughs to llama.cpp. These are opt-in and platform
# selective — `cuda` needs a CUDA toolkit, `vulkan` a Vulkan SDK — so
# `--all-features` is intentionally not a supported configuration; enable the
# backends your machine has. On Apple targets Metal is built regardless.
metal  = ["llama", "llama-cpp-2/metal"]
cuda   = ["llama", "llama-cpp-2/cuda"]
vulkan = ["llama", "llama-cpp-2/vulkan"]

[dependencies]
rusqlite      = { version = "0.40.2", features = ["bundled"] }
sqlite-vec    = "=0.1.9"
serde         = { version = "1.0.229", features = ["derive"] }
serde_yaml_bw = "2.5.8"
# preserve_order: object keys keep document order, matching JS
# `Object.keys`/`JSON.parse` semantics used by upstream filter
# validation and metadata reads.
serde_json    = { version = "1.0.151", features = ["preserve_order"] }
indexmap      = { version = "2.14.2", features = ["serde"] }
thiserror     = "2.0.21"
sha2          = "0.11.0"
walkdir       = "2.5.0"
globset       = "0.4.20"
regex         = "1.13.1"
granit-parser = "2.0"
strsim        = "0.11.1"
time          = { version = "0.3.36", features = ["formatting", "macros", "parsing"] }
# `common` is required (grammar sampler shim, try_accept); `openmp` is
# dropped (D10): it pulls libgomp.so.1 (Linux) / VCOMP140.DLL (MSVC)
# runtime deps, and is a no-op under AppleClang anyway — ggml uses its
# own thread pool.
llama-cpp-2   = { version = "=0.1.158", optional = true, default-features = false, features = ["common"] }
ureq          = { version = "3.4.2", optional = true }
tracing       = "0.1.44"
tree-sitter   = { version = "0.26.13", optional = true }
# Grammar crates pinned `=` to the exact upstream versions
# (p6-ast.md §2.2). JavaScript intentionally absent — upstream reuses
# the TypeScript grammar for `.js` (ast.ts:69).
tree-sitter-typescript = { version = "=0.23.2", optional = true }
tree-sitter-python     = { version = "=0.25.0", optional = true }
tree-sitter-go         = { version = "=0.25.0", optional = true }
tree-sitter-rust       = { version = "=0.24.0", optional = true }
dunce = "1.0.5"

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
